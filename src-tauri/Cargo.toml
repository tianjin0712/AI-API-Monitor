[package]
name = "ai-api-monitor"
version = "1.0.6"
description = "AI API Monitor - realtime AI API token/balance/cost monitoring desktop app"
authors = ["AI API Monitor"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_api_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
keyring = "4.1.6"
tokio = { version = "1.53.1", features = ["time", "macros", "rt-multi-thread", "sync", "net"] }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
async-trait = "0.1.92"
thiserror = "2.0.20"
uuid = { version = "1.24.0", features = ["v4"] }
url = "2.5.8"
regex = "1.12.2"
aes-gcm = "0.10.3"
rand = "0.8.5"
zeroize = "1.8.2"
base64 = "0.22.1"
semver = "1.0.26"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_WindowsAndMessaging"] }
