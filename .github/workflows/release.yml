name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tagged release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch annotated release tag
        shell: pwsh
        run: git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify immutable release metadata
        run: pnpm release:verify "${{ github.ref_name }}" --require-tag

      - name: Run quality gate
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Build Windows bundle (version derived from Git Tag)
        run: pnpm package:windows

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $portableDir = Join-Path $env:RUNNER_TEMP "AI-API-Monitor-portable"
          $portableZip = Join-Path $PWD "src-tauri/target/release/bundle/AI-API-Monitor-portable_$version.zip"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "src-tauri/target/release/ai-api-monitor.exe" (Join-Path $portableDir "AI API Monitor.exe")
          Copy-Item "docs/RELEASE.md" $portableDir
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $portableZip -CompressionLevel Optimal

      - name: Ensure release build did not mutate manifests
        shell: pwsh
        run: |
          $diff = git diff --exit-code -- package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw "Release build mutated version manifests; fix the release commit instead of rewriting versions in CI." }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/*.zip

      - name: Upload Windows bundle for workflow retention
        uses: actions/upload-artifact@v4
        with:
          name: ai-api-monitor-${{ github.ref_name }}-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/*.zip
          if-no-files-found: error
