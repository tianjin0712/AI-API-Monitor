name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tagged release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify immutable release metadata
        run: pnpm release:verify "${{ github.ref_name }}" --require-tag

      - name: Run quality gate
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Build Windows bundle (version derived from Git Tag)
        run: pnpm package:windows

      - name: Ensure release build did not mutate manifests
        shell: pwsh
        run: |
          $diff = git diff --exit-code -- package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw "Release build mutated version manifests; fix the release commit instead of rewriting versions in CI." }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Upload Windows bundle for workflow retention
        uses: actions/upload-artifact@v4
        with:
          name: ai-api-monitor-${{ github.ref_name }}-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
